<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo | Paróquia São Rafael Mooca</title>
    <link rel="icon" type="image/png" sizes="32x32" href="img/brasao_paroquia.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bingo-page">
    <div class="container">
        <ul class="header-decor" aria-hidden="true">
            <li class="flag f1"></li>
            <li class="flag f2"></li>
            <li class="flag f3"></li>
            <li class="flag f4"></li>
            <li class="flag f1"></li>
            <li class="flag f2"></li>
            <li class="flag f3"></li>
            <li class="flag f4"></li>
            <li class="flag f1"></li>
            <li class="flag f2"></li>
            <li class="flag f3"></li>
            <li class="flag f4"></li>
        </ul>
        <div class="header-bingo">
            <h1>BINGO DA PARÓQUIA SÃO RAFAEL</h1>
        </div>
          <main class="bingo-layout" aria-label="Painel do bingo">
              <section class="clause bingo-call-panel bingo-stage-panel" aria-label="Painel da pedra e controles">
               <div class="bingo-ball-stage" aria-live="polite" aria-atomic="true">
                    <div class="bingo-current-letter-wrap">
                        <div id="bingoCurrentLetter" class="bingo-current-letter">-</div>
                        <div class="bingo-current-letter-label">LETRA</div>
                    </div>
                    <div class="bingo-current-number-wrap">
                        <div id="bingoCurrentNumber" class="bingo-current-ball">--</div>
                        <div class="bingo-current-number-label">NUMERO</div>
                    </div>
                </div>
            </section>
            <section class="clause bingo-board-panel" aria-label="Painel de números do bingo">
                <h3>PAINEL DE NÚMEROS SORTEADOS</h3>
                <div id="bingoBoardGrid" class="bingo-board-grid" role="grid" aria-label="Painel de números do Bingo"></div>
            </section>
            <section class="clause bingo-call-panel bingo-controls-panel" aria-label="Painel da pedra e controles">
                 <form id="bingoCallForm" class="bingo-controls" novalidate>
                    <div class="bingo-controls-row bingo-controls-main-row">
                        <input id="bingoNumberInput" type="number" min="1" max="75" step="1" inputmode="numeric"
                            autocomplete="off" placeholder="Digite o número da pedra, e pressione Enter..." aria-label="Número da pedra">
                        <button id="btnCallNumber" class="btn" type="submit">Chamar Pedra</button>
                        <button id="btnUndoNumber" class="btn btn-secondary" type="button">Desfazer</button>
                        <button id="btnResetRound" class="btn btn-danger" type="button">Limpar Rodada</button>
                        <button id="btnFullscreen" class="btn" type="button">Tela Cheia</button>
                        <button id="btnToggleLayout" class="btn" type="button">Layout Anterior</button>
                        <button id="btnBingoCelebrate" class="btn btn-bingo" type="button">BINGO</button>
                    </div>
                    <p id="bingoStatus" class="bingo-status" role="status" aria-live="polite"></p>
                </form>
                <div class="bingo-history-wrap" aria-label="Histórico de pedras chamadas">
                    <h4>Histórico</h4>
                    <div id="bingoHistory" class="bingo-history-list"></div>
                </div>
            </section>
        </main>

        <div id="bingoCelebration" class="bingo-celebration" aria-hidden="true">
            <div class="bingo-celebration-stars" aria-hidden="true"></div>
            <div class="bingo-celebration-text">BINGO!</div>
        </div>
    </div>
    <script src="bingo.js"></script>
</body>
</html>
